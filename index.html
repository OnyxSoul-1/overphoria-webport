<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Overphoria: Active Ragdoll Combat</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="loader">
        <div class="loader-inner">
          <h1 class="title">Overphoria<span class="sub">Active Ragdoll Combat</span></h1>
          <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
          <div class="status" id="status">Loading 0%</div>
          <ul class="keys">
            <li><kbd>WASD</kbd> move</li>
            <li><kbd>LMB</kbd> punch</li>
            <li><kbd>RMB</kbd> kick</li>
            <li><kbd>F</kbd> block</li>
            <li><kbd>Space</kbd> jump</li>
            <li><kbd>E</kbd> grab</li>
            <li><kbd>Q</kbd> throw</li>
          </ul>
          <p class="hint">Gamepad and touch work too</p>
        </div>
      </div>

      <button id="fullscreen" type="button" title="Fullscreen" aria-label="Fullscreen" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/>
        </svg>
      </button>
      <div id="unity-warning"></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Non-critical warnings fade after a few seconds; errors stay on top of the canvas
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        div.className = type == 'error' ? 'banner error' : 'banner';
        warningBanner.appendChild(div);
        if (type != 'error') {
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.gz",
        frameworkUrl: buildUrl + "/Web.framework.js.gz",
        codeUrl: buildUrl + "/Web.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Overphoria - Active Ragdoll Combat",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      // The canvas fills the page (the itch.io embed frame or the browser window); on phones render at 1x to keep
      // the frame rate up
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        config.devicePixelRatio = 1;
        document.body.classList.add("mobile");
      }


      var fill = document.querySelector("#bar-fill");
      var statusText = document.querySelector("#status");
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var percent = Math.round(100 * progress);
          fill.style.width = percent + "%";
          statusText.textContent = percent < 90 ? "Loading " + percent + "%" : "Warming up the fighters";
        }).then((unityInstance) => {
          document.querySelector("#loader").classList.add("done");
          setTimeout(() => document.querySelector("#loader").remove(), 450);
          var fullscreen = document.querySelector("#fullscreen");
          fullscreen.hidden = false;
          fullscreen.onclick = () => unityInstance.SetFullscreen(1);
          canvas.focus();
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
