<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Overphoria: Active Ragdoll Combat - Ported by Onyx$oul-1</title>
    
    <!-- THE FAVICON (TAB LOGO) -->
    <link rel="icon" type="image/jpeg" href="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse1.mm.bing.net%2Fth%2Fid%2FOIP.ESQ48SSY0VcLm70exod8lQAAAA%3Fr%3D0%26pid%3DApi&f=1&ipt=b44494ee8ec554a3e290538938604147d6a20c923c79418dd6cf04c392d289f9&ipo=images">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./TemplateData/style.css">
    
    <style>
        .credit {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            font-weight: bold;
            z-index: 9999;
            pointer-events: none;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 3s linear infinite;
        }
        @keyframes rainbow { to { background-position: 200% center; } }
    </style>

    <!-- REGISTER SERVICE WORKER (For offline/headers) -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(e => console.log(e));
      }
    </script>

    <!-- MERGER SCRIPT FOR THE WASM PARTS -->
    <script>
      const originalFetch = window.fetch;
      window.fetch = async function(url, options) {
        const urlStr = url.toString();
        
        if (urlStr.includes('Web.wasm.gz')) {
          try {
            const parts = await Promise.all([1, 2, 3].map(n => 
              originalFetch('./Build/Web.wasm.gz.part' + n).then(r => r.arrayBuffer())
            ));
            const merged = new Uint8Array(parts.reduce((a, p) => a + p.byteLength, 0));
            let offset = 0;
            for (const p of parts) { merged.set(new Uint8Array(p), offset); offset += p.byteLength; }
            
            return new Response(merged, { 
              status: 200, 
              headers: new Headers({ 'Content-Type': 'application/wasm' }) 
            });
          } catch (e) {
            console.error('WASM Merge failed:', e);
          }
        }
        return originalFetch(url, options);
      };
    </script>
  </head>
  <body>
    <div id="game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div class="credit">Ported by Onyx$oul-1</div>

      <div id="loader">
        <div class="loader-inner">
          <h1 class="title">Overphoria<span class="sub">Active Ragdoll Combat</span></h1>
          <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
          <div class="status" id="status">Loading 0%</div>
          <ul class="keys">
            <li><kbd>WASD</kbd> move</li>
            <li><kbd>LMB</kbd> punch</li>
            <li><kbd>RMB</kbd> kick</li>
            <li><kbd>F</kbd> block</li>
            <li><kbd>Space</kbd> jump</li>
            <li><kbd>E</kbd> grab</li>
            <li><kbd>Q</kbd> throw</li>
          </ul>
          <p class="hint">Gamepad and touch work too</p>
        </div>
      </div>

      <button id="fullscreen" type="button" title="Fullscreen" aria-label="Fullscreen" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/>
        </svg>
      </button>
      <div id="unity-warning"></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        div.className = type == 'error' ? 'banner error' : 'banner';
        warningBanner.appendChild(div);
        if (type != 'error') {
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // LOCAL PATHS
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.gz",
        frameworkUrl: buildUrl + "/Web.framework.js.gz",
        codeUrl: buildUrl + "/Web.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Overphoria - Active Ragdoll Combat",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        config.devicePixelRatio = 1;
        document.body.classList.add("mobile");
      }

      var fill = document.querySelector("#bar-fill");
      var statusText = document.querySelector("#status");
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var percent = Math.round(100 * progress);
          fill.style.width = percent + "%";
          statusText.textContent = percent < 90 ? "Loading " + percent + "%" : "Warming up the fighters";
        }).then((unityInstance) => {
          document.querySelector("#loader").classList.add("done");
          setTimeout(() => document.querySelector("#loader").remove(), 450);
          var fullscreen = document.querySelector("#fullscreen");
          fullscreen.hidden = false;
          fullscreen.onclick = () => unityInstance.SetFullscreen(1);
          canvas.focus();
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
